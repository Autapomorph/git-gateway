user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Buffer settings for large binary downloads (installers / update bundles)
    client_max_body_size 50M;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Upstream pool with keepalive connections for low latency between Nginx and Express
    upstream gateway_backend {
        server git-gateway:3000;
        keepalive 32;
    }

    # HTTP server: handles health check and directs traffic
    server {
        listen 80;
        server_name _;

        # Healthcheck endpoint
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Proxy directly or redirect to HTTPS when certificates are configured
        location / {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tauri updater and channel headers passthrough
            proxy_set_header X-Update-Channel $http_x_update_channel;
            proxy_set_header X-App-Language $http_x_app_language;
            proxy_set_header X-Framework-Version $http_x_framework_version;
        }
    }

    # HTTPS server with HTTP/2 enabled
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL Certificates path inside the container
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Healthcheck endpoint over HTTPS
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Reverse proxy to Express backend using HTTP/1.1 keepalive
        location / {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Tauri updater and channel headers passthrough
            proxy_set_header X-Update-Channel $http_x_update_channel;
            proxy_set_header X-App-Language $http_x_app_language;
            proxy_set_header X-Framework-Version $http_x_framework_version;
        }
    }
}
